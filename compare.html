<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draft Comparison — Revision Coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="section-container navbar-inner">
      <a href="index.html" class="logo"><div class="logo-icon">✎</div><div><span class="logo-text">Revision Coach</span></div></a>
      <nav class="nav-links" data-nav-desktop></nav>
      <button type="button" class="menu-toggle" id="menu-toggle">☰</button>
    </div>
    <div class="section-container mobile-nav" id="mobile-nav" data-nav-mobile></div>
  </header>
  <main><div class="section-container" style="padding:2.5rem 1.25rem;" id="page-root"></div></main>
  <footer class="footer"><div class="section-container footer-bottom">Revision Coach</div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/mock-ai.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    renderNavFooter("upload");
    let essay;
    let original;
    let revised;
    let explanations = [];

    function renderScoreClosure() {
      const initialScore = essay.scoringHistory?.[0]?.band ?? essay.diagnostic?.previousBand ?? null;
      const latestScore = essay.scoringHistory?.[essay.scoringHistory.length - 1]?.band ?? essay.diagnostic?.overallBandEstimate ?? null;
      const delta = latestScore != null && initialScore != null ? Math.round((latestScore - initialScore) * 10) / 10 : null;
      const completion = essay.lastRevisionResult || null;
      return `
        <div class="glass-card score-comparison-card mb-4">
          <div class="score-comparison-grid">
            <div>
              <p class="score-kicker">Initial Score</p>
              <p class="score-number">${initialScore != null ? Number(initialScore).toFixed(1) : "—"}</p>
            </div>
            <div>
              <p class="score-kicker">Revised Score</p>
              <p class="score-number">${latestScore != null ? Number(latestScore).toFixed(1) : "—"}</p>
            </div>
            <div>
              <p class="score-kicker">Score Change</p>
              <p class="score-number ${delta > 0 ? "positive" : delta < 0 ? "negative" : ""}">${delta != null ? `${delta > 0 ? "+" : ""}${Number(delta).toFixed(1)}` : "—"}</p>
            </div>
          </div>
          <p class="score-comparison-note">${completion ? `Diagnosis issues completed: ${completion.resolvedIssues}/${completion.totalIssues}.` : "This screen closes the loop by comparing the old draft score with the revised draft score."}</p>
        </div>`;
    }

    async function ensureExplanations() {
      if (explanations.length === 0 && revised.content !== original.content) {
        showLoading("Generating revision logic explanations...");
        explanations = await generateRevisionExplanations(original.content, revised.content);
        essay.revisionExplanations = explanations;
        essay = await saveEssay(essay);
        hideLoading();
      }
    }

    function renderExplanations() {
      if (!explanations.length) {
        return `<div class="glass-card empty-state"><p>Save a revision first to see logic explanations.</p><a href="revise.html?id=${essay.id}" class="btn btn-primary mt-4">Go to Revision</a></div>`;
      }
      return explanations.map(exp => `
        <div class="explanation-card">
          <div class="issue-type">${SUBCATEGORY_LABELS[exp.issueType] || exp.issueType} · ${CATEGORY_LABELS[exp.category]}</div>
          <div class="explanation-row">
            <div class="explanation-block original"><div class="label">Original</div>${escapeHtml(exp.original)}</div>
            <div class="explanation-block revised"><div class="label">Revised</div>${escapeHtml(exp.revised)}</div>
          </div>
          <p style="font-size:0.875rem;margin:0.5rem 0;"><strong>Why:</strong> ${exp.reason}</p>
          <p style="font-size:0.8125rem;color:var(--sage-700);"><strong>Solved:</strong> ${exp.solved}</p>
        </div>`).join("");
    }

    function renderCompareView() {
      document.getElementById("page-root").innerHTML = `
        ${renderWorkflowBanner("compare")}
        <div class="flex-between mb-4">
          <div>
            <p class="step-label">Revision Logic Explanation</p>
            <h1>${essay.title}</h1>
            <p style="color:#64748b;">Understand WHY each change was made — learn the logic, not just the result.</p>
          </div>
          <div class="page-actions" style="margin:0;">
            <a href="revise.html?id=${essay.id}" class="btn btn-outline">Continue Revising</a>
            <a href="reflect.html?id=${essay.id}" class="btn btn-primary">Writing Reflection →</a>
          </div>
        </div>
        ${renderRoundTimeline(essay)}
        ${renderScoreProgression(essay)}
        ${renderScoreClosure()}

        <div id="tab-container">
          <div class="tab-bar">
            <button class="tab-btn active" data-tab="side">Side-by-Side</button>
            <button class="tab-btn" data-tab="logic">Revision Logic (${explanations.length})</button>
          </div>
          <div class="tab-content" data-tab="side">
            <div class="compare-grid">
              <div class="compare-col">
                <h4>📄 ${original.label} · ${original.wordCount} words</h4>
                <div class="compare-text">${escapeHtml(original.content)}</div>
              </div>
              <div class="compare-col revised">
                <h4>✏️ ${revised.label} · ${revised.wordCount} words</h4>
                <div class="compare-text">${escapeHtml(revised.content)}</div>
              </div>
            </div>
          </div>
          <div class="tab-content hidden" data-tab="logic">
            <p style="font-size:0.875rem;color:#64748b;margin-bottom:1rem;">Each change is explained so you learn the writing principle behind it.</p>
            ${renderExplanations()}
          </div>
        </div>

        <div class="action-bar">
          <p><strong>Closed loop complete:</strong> you can now see the original score, revised score, and the exact revision logic that produced the improvement.</p>
          <a href="revise.html?id=${essay.id}" class="btn btn-outline">Another Revision Round</a>
          <a href="reflect.html?id=${essay.id}" class="btn btn-primary">Generate Reflection Summary</a>
        </div>`;
      bindTabs("tab-container");
    }

    (async function init() {
      const state = await initPage({ requireAuth: true, containerId: "page-root" });
      if (state.redirected) return;
      if (!state.configured) {
        renderSetupRequired("page-root", "Add your Supabase keys in assets/js/config.js first.");
        return;
      }
      const essayId = getQueryParam("id");
      essay = essayId ? await getEssay(essayId) : null;
      if (!essay || essay.versions.length < 1) {
        window.location.href = "upload.html";
        return;
      }
      original = essay.versions[0];
      revised = essay.versions[essay.versions.length - 1];
      explanations = essay.revisionExplanations || [];
      await ensureExplanations();
      renderCompareView();
    })();
  </script>
</body>
</html>
