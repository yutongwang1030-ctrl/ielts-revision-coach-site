<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guided Revision — Revision Coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="section-container navbar-inner">
      <a href="index.html" class="logo"><div class="logo-icon">✎</div><div><span class="logo-text">Revision Coach</span></div></a>
      <nav class="nav-links" data-nav-desktop></nav>
      <button type="button" class="menu-toggle" id="menu-toggle">☰</button>
    </div>
    <div class="section-container mobile-nav" id="mobile-nav" data-nav-mobile></div>
  </header>
  <main><div class="section-container" style="padding:2.5rem 1.25rem;" id="page-root"></div></main>
  <footer class="footer"><div class="section-container footer-bottom">Revision Coach</div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/mock-ai.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    renderNavFooter("upload");
    let essay;
    let revisionChecklist = [];
    let content = "";

    function getInitialBand() {
      return essay.scoringHistory?.[0]?.band ?? essay.scoringHistory?.[0]?.diagnostic?.overallBandEstimate ?? essay.diagnostic?.previousBand ?? essay.diagnostic?.overallBandEstimate ?? null;
    }

    function getLatestBand() {
      const last = essay.scoringHistory?.[essay.scoringHistory.length - 1];
      return last?.band ?? essay.diagnostic?.overallBandEstimate ?? null;
    }

    function renderChecklistItem(item) {
      return `<div class="glass-card revision-task-card ${item.resolved ? "resolved" : ""}">
        <div class="revision-task-header">
          <div>
            <p class="revision-task-order">Task ${item.order}</p>
            <h4>${item.title}</h4>
          </div>
          <div class="revision-task-meta">
            <span class="badge ${badgeClass(item.category)}">${CATEGORY_LABELS[item.category] || item.category}</span>
            <span class="badge ${severityBadge(item.severity)}">${item.severity}</span>
          </div>
        </div>
        <p class="revision-task-location">📍 ${escapeHtml(item.location)}</p>
        <div class="revision-task-block">
          <strong>Diagnosis Finding 诊断发现：</strong>
          <p>${escapeHtml(item.problem)}</p>
        </div>
        ${item.evidence ? `<div class="revision-task-block"><strong>Quoted Student Sentence 学生原句：</strong><p>"${escapeHtml(item.evidence)}"</p></div>` : ""}
        ${item.explanation ? `<div class="revision-task-block"><strong>Why It Lowers the Band 为什么会扣分：</strong><p>${escapeHtml(item.explanation)}</p></div>` : ""}
        <div class="revision-task-block revision-action-block">
          <strong>Action Step 修改动作：</strong>
          <p>${escapeHtml(item.action)}</p>
        </div>
        <div class="revision-task-block">
          <strong>Done Standard 完成标准：</strong>
          <p>${escapeHtml(item.doneCriteria)}</p>
        </div>
        <label class="revision-checkline">
          <input type="checkbox" data-task-resolved="${item.id}" ${item.resolved ? "checked" : ""} />
          <span>I revise this exact diagnosis issue 我已完成这一条对应修改。</span>
        </label>
      </div>`;
    }

    function renderRevisionExample(item) {
      const example = item.rewriteExample || {};
      return `<div class="glass-card revision-example-card">
        <div class="revision-task-header">
          <div>
            <p class="revision-task-order">Model for Task ${item.order}</p>
            <h4>${item.title}</h4>
          </div>
          <div class="revision-task-meta">
            <span class="badge ${badgeClass(item.category)}">${CATEGORY_LABELS[item.category] || item.category}</span>
          </div>
        </div>
        <div class="revision-task-block">
          <strong>Original Sentence 原句定位：</strong>
          <p>${escapeHtml(example.original || item.evidence || item.problem)}</p>
        </div>
        <div class="revision-task-block">
          <strong>Guidance 修改说明：</strong>
          <p>${escapeHtml(example.guidance || item.action)}</p>
        </div>
        <div class="revision-task-block revision-action-block">
          <strong>Sample Revision 示范改法：</strong>
          <p>${escapeHtml(example.sample || item.action)}</p>
        </div>
      </div>`;
    }

    function renderChecklistPanel() {
      const summary = summarizeRevisionCompletion(revisionChecklist);
      return `
        <div class="glass-card checklist-summary-card">
          <div>
            <p class="step-label">Diagnosis → Revise Lockstep</p>
            <h3 class="card-title" style="margin-bottom:0.35rem;">Revise only these diagnosed issues 只改诊断里已经定位的问题</h3>
            <p style="color:#64748b;">No new questions, no broad reflection prompts. 按照这份清单逐条修，一条 Diagnosis 对应一条具体修改。</p>
          </div>
          <div class="checklist-progress">
            <strong>${summary.resolved}/${summary.total}</strong>
            <span>issues revised 已完成问题数</span>
          </div>
        </div>
        <div class="revision-task-list">${revisionChecklist.map(renderChecklistItem).join("")}</div>
      `;
    }

    function renderRevisionExamplesPanel() {
      return `
        <div class="glass-card checklist-summary-card">
          <div>
            <p class="step-label">Original → Example Rewrite</p>
            <h3 class="card-title" style="margin-bottom:0.35rem;">Targeted revision models 对照修改示范</h3>
            <p style="color:#64748b;">Each card quotes the original sentence and shows the kind of change expected. 每张卡片都对应左侧某一条问题，先看原句，再参考示范改法。</p>
          </div>
        </div>
        <div class="revision-task-list">${revisionChecklist.map(renderRevisionExample).join("")}</div>
      `;
    }

    function renderPage() {
      const wc = countWords(content);
      const round = essay.currentRound || 1;
      const completion = summarizeRevisionCompletion(revisionChecklist);
      const latestBand = getLatestBand();
      const initialBand = getInitialBand();
      document.getElementById("page-root").innerHTML = `
        ${renderWorkflowBanner("revise")}
        <div class="flex-between mb-4">
          <div>
            <p class="step-label">Step 3 — Guided Revision · Round ${round}</p>
            <h1>${essay.title}</h1>
            <span class="badge badge-success">${essay.versions.length} draft(s)</span>
            <span class="badge badge-default">${completion.resolved}/${completion.total} diagnosis issues revised</span>
          </div>
          <div class="page-actions" style="margin:0;">
            <a href="diagnose.html?id=${essay.id}" class="btn btn-outline">Diagnosis</a>
            <button type="button" class="btn btn-outline" id="save-btn">💾 Save Draft</button>
            <button type="button" class="btn btn-primary" id="submit-score-btn">Submit Revised Draft for New Score</button>
          </div>
        </div>
        ${renderRoundTimeline(essay)}
        <div class="glass-card score-closure-card mb-4">
          <div>
            <p class="step-label">Scoring Loop</p>
            <h3 class="card-title" style="margin-bottom:0.35rem;">Revision must lead to a new score</h3>
            <p style="color:#64748b;">Initial score: <strong>${initialBand ?? "—"}</strong> · Latest visible score: <strong>${latestBand ?? "—"}</strong></p>
          </div>
          <div class="score-closure-hint">${completion.allResolved ? "All diagnosis issues marked revised. Submit for new scoring." : `Finish ${completion.remaining} more issue(s) before re-scoring.`}</div>
        </div>
        <div class="revise-split-layout">
          <div>
            <h2 style="font-family:var(--font-display);font-size:1.125rem;margin-bottom:1rem;">Diagnosis Issues to Fix 待修改问题清单</h2>
            <div id="checklist-panel">${renderChecklistPanel()}</div>
          </div>
          <div style="display:grid;gap:1.25rem;">
            <div id="examples-panel">${renderRevisionExamplesPanel()}</div>
            <div class="glass-card">
              <div class="flex-between mb-4"><h3 class="card-title" style="margin:0;">✏️ Your Revision 学生修改区</h3><span class="word-count">${wc} words</span></div>
              <textarea id="revision-editor" rows="20" style="font-family:ui-monospace,monospace;font-size:0.875rem;"></textarea>
              <p class="hint-text">Revise in your own words, but only target the diagnosed issues listed on the left. 右侧修改内容必须和左侧问题一一对应，每勾选一项，就应当在稿子里看到那一处真实变化。</p>
            </div>
          </div>
        </div>
        <div class="action-bar" id="post-save-actions" style="display:none;">
          <p><strong>Draft saved.</strong> Next step: submit this revised draft to generate a new score and compare improvement against the original version.</p>
          <a href="compare.html?id=${essay.id}" class="btn btn-primary">View Revision Logic →</a>
          <button type="button" class="btn btn-secondary" id="reeval-btn">Generate New Score</button>
          <a href="reflect.html?id=${essay.id}" class="btn btn-outline">Writing Reflection</a>
        </div>
        <style>
          .revise-split-layout{display:grid;gap:2rem;}
          @media(min-width:1024px){.revise-split-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;}}
        </style>`;
      document.getElementById("revision-editor").value = content;
      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll("[data-task-resolved]").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          revisionChecklist = revisionChecklist.map((item) =>
            item.id === checkbox.dataset.taskResolved ? { ...item, resolved: checkbox.checked } : item
          );
          essay.revisionChecklist = revisionChecklist;
          document.getElementById("checklist-panel").innerHTML = renderChecklistPanel();
          bindEvents();
        });
      });

      document.getElementById("revision-editor").addEventListener("input", e => { content = e.target.value; });

      document.getElementById("save-btn").addEventListener("click", async () => {
        showLoading("Analyzing your revision logic...");
        const original = essay.versions[0].content;
        const explanations = await generateRevisionExplanations(original, content);
        createOrUpdateRevisedVersion();
        essay.revisionExplanations = explanations;
        essay.revisionChecklist = revisionChecklist;
        essay.status = "revising";
        essay.updatedAt = new Date().toISOString();
        essay = await saveEssay(essay);

        hideLoading();
        document.getElementById("post-save-actions").style.display = "flex";
        renderPage();
        document.getElementById("post-save-actions").style.display = "flex";
        bindReEval();
      });

      document.getElementById("submit-score-btn").addEventListener("click", async () => {
        await submitForReEvaluation();
      });
    }

    function bindReEval() {
      const btn = document.getElementById("reeval-btn");
      if (!btn) return;
      btn.addEventListener("click", async () => {
        await submitForReEvaluation();
      });
    }

    async function submitForReEvaluation() {
      const completion = summarizeRevisionCompletion(revisionChecklist);
      if (!completion.allResolved) {
        alert(`Please revise all ${completion.total} diagnosed issues before requesting a new score. 你还有 ${completion.remaining} 条问题没有完成对应修改。`);
        return;
      }

      showLoading("Generating your revised score and comparing it with the original draft...");
      const prevBand = essay.diagnostic?.overallBandEstimate;
      const nextRound = (essay.currentRound || 1) + 1;
      createOrUpdateRevisedVersion();
      const latestVersion = essay.versions[essay.versions.length - 1];
      const diagnostic = await requestScore({
        essayContent: latestVersion.content,
        prompt: essay.prompt || "",
        taskType: essay.taskType,
        round: nextRound,
        previousBand: prevBand,
      });
      const now = new Date().toISOString();
      const completionSummary = summarizeRevisionCompletion(revisionChecklist);

      essay.diagnostic = diagnostic;
      essay.errorDetails = diagnostic.errorDetails;
      essay.currentRound = nextRound;
      essay.scoringHistory = essay.scoringHistory || [];
      essay.scoringHistory.push({ round: nextRound, band: diagnostic.overallBandEstimate, diagnostic, versionId: latestVersion.id, createdAt: now });
      essay.revisionRounds.push({ round: nextRound, startedAt: now, status: "active" });
      essay.revisionChecklist = revisionChecklist;
      essay.lastRevisionResult = {
        initialBand: getInitialBand(),
        revisedBand: diagnostic.overallBandEstimate,
        improvementDelta: diagnostic.improvementDelta,
        resolvedIssues: completionSummary.resolved,
        totalIssues: completionSummary.total,
        completedAt: now,
      };
      essay.status = "diagnosed";
      essay.updatedAt = now;
      essay = await saveEssay(essay);
      hideLoading();
      window.location.href = "compare.html?id=" + essay.id;
    }

    function createOrUpdateRevisedVersion() {
      const now = new Date().toISOString();
      const latestVersion = essay.versions[essay.versions.length - 1];
      const isOriginalOnly = essay.versions.length === 1;
      const needsNewVersion = isOriginalOnly || latestVersion.content !== content;

      if (needsNewVersion) {
        const versionNum = essay.versions.length;
        essay.versions.push({
          id: "v-" + Date.now(),
          content,
          wordCount: countWords(content),
          createdAt: now,
          label: `Draft ${versionNum + 1}`,
        });
      } else {
        latestVersion.content = content;
        latestVersion.wordCount = countWords(content);
        latestVersion.createdAt = now;
      }
    }

    (async function init() {
      const state = await initPage({ requireAuth: true, containerId: "page-root" });
      if (state.redirected) return;
      if (!state.configured) {
        renderSetupRequired("page-root", "Add your Supabase keys in assets/js/config.js first.");
        return;
      }
      const essayId = getQueryParam("id");
      essay = essayId ? await getEssay(essayId) : null;
      if (!essay) {
        window.location.href = "upload.html";
        return;
      }
      content = essay.versions[essay.versions.length - 1].content;
      revisionChecklist = buildRevisionChecklistFromDiagnostic(essay.diagnostic, essay.revisionChecklist || []);
      essay.revisionChecklist = revisionChecklist;
      renderPage();
      if (essay.versions.length > 1) {
        document.getElementById("post-save-actions").style.display = "flex";
        bindReEval();
      }
    })();
  </script>
</body>
</html>
