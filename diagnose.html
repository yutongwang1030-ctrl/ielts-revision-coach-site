<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnosis — Revision Coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="section-container navbar-inner">
      <a href="index.html" class="logo"><div class="logo-icon">✎</div><div><span class="logo-text">Revision Coach</span></div></a>
      <nav class="nav-links" data-nav-desktop></nav>
      <button type="button" class="menu-toggle" id="menu-toggle">☰</button>
    </div>
    <div class="section-container mobile-nav" id="mobile-nav" data-nav-mobile></div>
  </header>
  <main><div class="section-container" style="padding:2.5rem 1.25rem;" id="page-content"></div></main>
  <footer class="footer"><div class="section-container footer-bottom">Revision Coach</div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    renderNavFooter("upload");

    function renderScoreComparison(diagnostic, essay) {
      const initialScore = essay.scoringHistory?.[0]?.band ?? diagnostic.previousBand ?? diagnostic.overallBandEstimate;
      const latestScore = diagnostic.overallBandEstimate;
      const delta = diagnostic.improvementDelta;
      return `
        <div class="glass-card score-comparison-card mb-4">
          <div class="score-comparison-grid">
            <div>
              <p class="score-kicker">Initial Draft</p>
              <p class="score-number">${Number(initialScore).toFixed(1)}</p>
            </div>
            <div>
              <p class="score-kicker">Revised Draft</p>
              <p class="score-number">${Number(latestScore).toFixed(1)}</p>
            </div>
            <div>
              <p class="score-kicker">Improvement</p>
              <p class="score-number ${delta > 0 ? "positive" : delta < 0 ? "negative" : ""}">${delta > 0 ? "+" : ""}${Number(delta || 0).toFixed(1)}</p>
            </div>
          </div>
          <p class="score-comparison-note">Diagnosis and revision are now closed-loop: the revised score reflects the exact issues addressed in the previous diagnosis.</p>
        </div>`;
    }

    async function renderDiagnosisPage() {
      const state = await initPage({ requireAuth: true, containerId: "page-content" });
      if (state.redirected) return;
      if (!state.configured) {
        renderSetupRequired("page-content", "Add your Supabase keys in assets/js/config.js first.");
        return;
      }

      const essayId = getQueryParam("id");
      const essay = essayId ? await getEssay(essayId) : null;
      if (!essay || !essay.diagnostic) {
        window.location.href = "upload.html";
        return;
      }

      const d = essay.diagnostic;
      const v0 = essay.versions[0];
      const isReEval = d.round > 1;

      const criteriaHtml = d.criteria.map((c) => `
      <div class="glass-card criterion-card">
        <div class="flex-between">
          <span style="font-size:0.875rem;font-weight:500;">${c.label}</span>
          <strong style="color:var(--sage-700);">${c.score}/${c.maxScore}</strong>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${(c.score/c.maxScore)*100}%"></div></div>
        <p style="font-size:0.8125rem;color:#64748b;margin:0.5rem 0;">${c.summary}</p>
        ${c.deductions ? `<ul class="deduction-list">${c.deductions.map(x => `<li><span>${x.reason}</span><span class="deduction-impact">${x.impact}</span></li>`).join("")}</ul>` : ""}
        ${c.actionableAdvice ? `<div class="advice-box">💡 ${c.actionableAdvice}</div>` : ""}
      </div>`).join("");

      const issuesHtml = d.issues.map((issue) => `
      <div class="glass-card issue-card">
        <div class="issue-header">
          <h4>${issue.title}</h4>
          <span class="badge ${badgeClass(issue.category)}">${CATEGORY_LABELS[issue.category]}</span>
          ${issue.subcategory ? `<span class="badge badge-default">${SUBCATEGORY_LABELS[issue.subcategory] || issue.subcategory}</span>` : ""}
          <span class="badge ${severityBadge(issue.severity)}">${issue.severity}</span>
        </div>
        <p style="font-size:0.875rem;color:#475569;"><strong>Issue to Fix 问题定位：</strong>${issue.description}</p>
        ${issue.location ? `<p style="font-size:0.75rem;color:#94a3b8;font-style:italic;">📍 ${issue.location}</p>` : ""}
        ${issue.rewriteExample?.original ? `<div class="revision-task-block"><strong>Quoted Student Sentence 学生原句：</strong><p>"${issue.rewriteExample.original}"</p></div>` : ""}
        <div class="suggestion-box"><strong>Fix Direction 修改动作：</strong> ${issue.suggestion}</div>
        ${issue.rewriteExample?.sample ? `<div class="advice-box">🛠 <strong>Targeted Rewrite Example 修改示范：</strong> ${issue.rewriteExample.sample}</div>` : ""}
        <div class="reflective">💬 <strong>Completion Standard 完成标准：</strong> ${issue.reflectivePrompt}</div>
      </div>`).join("");

      document.getElementById("page-content").innerHTML = `
      ${renderWorkflowBanner("diagnose")}
      <div class="flex-between mb-4">
        <div>
          <p class="step-label">Step 2 — IELTS Diagnosis · Round ${d.round || 1}</p>
          <h1>${essay.title}</h1>
          <p style="color:#64748b;">${essay.taskType === "task1" ? "Task 1" : "Task 2"} · ${v0.wordCount} words</p>
        </div>
        <div class="page-actions" style="margin:0;">
          <a href="revise.html?id=${essay.id}" class="btn btn-primary">Start Guided Revision →</a>
          ${essay.versions.length > 1 ? `<a href="compare.html?id=${essay.id}" class="btn btn-outline">Compare Drafts</a>` : ""}
        </div>
      </div>

      ${renderRoundTimeline(essay)}
      ${renderScoreProgression(essay)}
      ${isReEval ? renderScoreComparison(d, essay) : ""}

      <div id="diagnose-grid" style="display:block;">
        <div style="display:grid;gap:2rem;">
          <div>
            <div class="glass-card mb-4" style="background:linear-gradient(135deg,var(--sage-50),white);">
              <p style="font-size:0.875rem;color:var(--sage-600);font-weight:500;">Estimated Band (IELTS-calibrated) 预估分数</p>
              <div style="display:flex;align-items:baseline;gap:0.75rem;">
                <p class="band-score">${d.overallBandEstimate.toFixed(1)}</p>
                ${d.improvementDelta != null ? formatBandDelta(d.improvementDelta) : ""}
              </div>
              ${isReEval && d.previousBand ? `<p class="band-note">Previous: Band ${d.previousBand} → Now: Band ${d.overallBandEstimate}</p>` : ""}
              <p class="band-note">Scored against official IELTS criteria. 按 IELTS 四项标准估分，比普通泛化 AI 更严格。</p>
            </div>
            ${criteriaHtml}
            <div class="glass-card coach-message mb-4">
              <h3 class="card-title">💬 Coach's Message 教练提示</h3>
              <p style="color:#334155;line-height:1.7;">${d.encouragingSummary}</p>
            </div>
            <div class="glass-card mb-4">
              <h3 class="card-title">✓ Strengths 优点表现</h3>
              <ul class="strength-list">${d.strengths.map(s => `<li>✓ ${s}</li>`).join("")}</ul>
            </div>
            <div class="glass-card">
              <h3 class="card-title">🎯 Revision Priorities 修改优先级</h3>
              <ol class="priority-list">${d.revisionPriorities.map((p,i) => `<li><span class="priority-num">${i+1}</span>${p}</li>`).join("")}</ol>
            </div>
          </div>
          <div>
            <h2 style="font-family:var(--font-display);font-size:1.25rem;color:var(--sage-800);margin-bottom:1rem;">Issues to Fix 待修改问题 (${d.issues.length})</h2>
            <p style="font-size:0.875rem;color:#64748b;margin-bottom:1rem;">下面这份清单是唯一需要带入 Revise 的问题列表。每一条都已经给出原句锚点、问题解释、修改动作和示范方向，不再保留另一套重复计划。</p>
            ${issuesHtml}
            <div class="action-bar">
              <p><strong>Next Step 下一步：</strong>进入 Revise，只处理上面这份 <code>Issues to Fix</code> 清单；每修完一条，就完成一处对应整改。</p>
              <a href="revise.html?id=${essay.id}" class="btn btn-primary">Go Fix These Issues →</a>
              <a href="journey.html" class="btn btn-outline">View Journey</a>
            </div>
          </div>
        </div>
      </div>
      <style>@media(min-width:1024px){#diagnose-grid>div{grid-template-columns:1fr 1.5fr!important;display:grid!important;}}</style>`;
    }

    renderDiagnosisPage();
  </script>
</body>
</html>
